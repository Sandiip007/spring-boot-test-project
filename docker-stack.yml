version: "3.8"

services:

  springboot:
    image: dyutidrun/spring-boot-app:latest

    ports:
      - "8080:8080"

    deploy:
      replicas: 2

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

      rollback_config:
        parallelism: 1
        delay: 5s

    networks:
      - springboot-network

networks:
  springboot-network:
    driver: overlay
